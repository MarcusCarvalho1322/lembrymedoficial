# ═══════════════════════════════════════════════════════════
# LEMBRYMED — Docker Compose (Produção VPS)
# ═══════════════════════════════════════════════════════════
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# ═══════════════════════════════════════════════════════════

services:
  # ── Reverse Proxy (Caddy — SSL automático) ─────────────────
  caddy:
    image: caddy:2-alpine
    container_name: lembrymed-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - lembrymed

  # ── Redis (BullMQ + cache + dedup) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lembrymed-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lembrymed
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL (banco de dados self-hosted) ─────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lembrymed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lembrymed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lembrymed}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lembrymed} -d ${POSTGRES_DB:-lembrymed}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lembrymed
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── API Express + Workers BullMQ ───────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    container_name: lembrymed-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-lembrymed}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lembrymed}
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-zapi}
      ZAPI_INSTANCE_ID: ${ZAPI_INSTANCE_ID}
      ZAPI_TOKEN: ${ZAPI_TOKEN}
      ZAPI_CLIENT_TOKEN: ${ZAPI_CLIENT_TOKEN}
      ZAPI_WEBHOOK_TOKEN: ${ZAPI_WEBHOOK_TOKEN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ANNUAL: ${STRIPE_PRICE_ANNUAL}
      WEB_URL: ${WEB_URL}
      API_URL: ${API_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ADMIN_WHATSAPP: ${ADMIN_WHATSAPP:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_SECRET: ${METRICS_SECRET:-}
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - lembrymed
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Web Next.js (Landing + Admin) ──────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    container_name: lembrymed-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WEB_URL: ${WEB_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PRICE_ANNUAL: ${STRIPE_PRICE_ANNUAL}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - lembrymed
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  lembrymed:
    driver: bridge

volumes:
  redisdata:
    driver: local
  pgdata:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
