# Railway service: lembrymed-workers
#
# Service Railway separado para os 8 workers BullMQ + crons. Mesma imagem
# Docker do service API (`apps/api/Dockerfile`) — o que muda é a variável
# RUN_MODE=workers (definir no painel Railway).
#
# Variáveis OBRIGATÓRIAS no painel desse service:
#   RUN_MODE=workers
#   WORKERS_HEALTH_PORT=3001   (default; pode ficar implícito)
#   DATABASE_URL, REDIS_URL, ANTHROPIC_API_KEY, ZAPI_INSTANCE_ID, ZAPI_TOKEN,
#   ZAPI_CLIENT_TOKEN, WHATSAPP_PROVIDER=zapi, STRIPE_SECRET_KEY,
#   STRIPE_PRICE_ANNUAL, STRIPE_WEBHOOK_SECRET, WEB_URL, NEXTAUTH_SECRET,
#   ADMIN_EMAIL, ADMIN_PASSWORD_HASH, ZAPI_WEBHOOK_TOKEN
#
# (Sim, o boot valida o schema completo — mesmo neste modo. Simplifica
# a operação porque uma única env Railway pode ser compartilhada entre
# os 2 services via Reference Variables.)
#
# Variáveis OPCIONAIS:
#   ADMIN_WHATSAPP, SENTRY_DSN, METRICS_SECRET, LOG_LEVEL

[build]
builder = "dockerfile"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
# Health check do worker checa Redis (workers dependem dele). Porta 3001.
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "always"
